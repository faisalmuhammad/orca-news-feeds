name: Check and release Feeds

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feeds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Build, test and validate
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: build/package-lock.json

      - name: Check version, tag and changelog
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node build/scripts/ci-release.mjs

      - name: Require release commits to be merged into main
        if: github.ref_type == 'tag'
        run: git merge-base --is-ancestor HEAD origin/main

      - name: Install pinned Orca CLI
        run: bash .github/scripts/install-orca.sh

      - name: Install locked dependencies
        run: npm ci --prefix build

      - name: Typecheck
        run: npm run typecheck

      - name: Build and test
        run: npm test

      - name: Test with Orca's host mocks
        run: orca plugin test . --json

      - name: Audit dependencies
        run: npm audit --prefix build

      - name: Check release files, artwork, licenses and privacy
        run: npm run release:check

      - name: Validate with Orca
        run: orca plugin validate . --json

      - name: Require committed build output to match source
        run: git diff --exit-code

  release:
    name: Publish GitHub release
    needs: checks
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare notes from the matching changelog entry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node build/scripts/ci-release.mjs "$RUNNER_TEMP/feeds-release-notes.md"

      - name: Publish release with no attached assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "Feeds for Orca ${RELEASE_TAG#v}" \
            --notes-file "$RUNNER_TEMP/feeds-release-notes.md"
